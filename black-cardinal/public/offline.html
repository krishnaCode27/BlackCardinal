<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>No internet connection | Black Cardinal</title>
<style>
/* Fully self-contained: no external fonts, CSS, JS or images (it must work offline). */
:root{--bg:#050505;--ink:#fff;--mute:#9a9a9a;--red:#e3202b;--red-dark:#c81b25;--ease:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;display:flex;flex-direction:column;padding:32px 28px calc(32px + env(safe-area-inset-bottom,0px))}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:0}
.glow.a{top:-180px;right:-160px;background:radial-gradient(circle,rgba(227,32,43,.32),transparent 65%)}
.glow.b{bottom:-200px;left:-180px;background:radial-gradient(circle,rgba(227,32,43,.16),transparent 65%)}
.brand,.mid,.act{position:relative;z-index:1}
.brand{font-size:16px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--red)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:in .6s var(--ease) both}
.ring{width:96px;height:96px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;box-shadow:0 0 40px rgba(227,32,43,.35)}
.ring svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:28px 0 10px;font-size:26px;line-height:1.25;font-weight:700}
p{font-size:15px;line-height:1.6;color:var(--mute);max-width:280px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:inherit;font-size:15px;font-weight:600;line-height:1;cursor:pointer;transition:background-color .25s var(--ease),transform .3s var(--ease)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (hover:hover){.btn:hover{background:var(--red-dark)}}
@media (min-width:768px){
 body{padding:32px 48px}
 .glow{width:640px;height:640px}
 .brand{font-size:18px}
 .ring{width:112px;height:112px}
 .ring svg{width:52px;height:52px}
 h1{font-size:32px}
 p{font-size:16px;max-width:360px}
 .act{display:flex;justify-content:center;padding-bottom:12vh}
 .btn{width:280px}
}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mid{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div>
<div class="brand">BLACK <span>CARDINAL</span></div>
<main class="mid">
  <div class="ring" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8a15 15 0 0 0-9-4.3M5 12.9a10 10 0 0 1 5-2.7M19 12.9a10 10 0 0 0-2.6-2.1M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
  </div>
  <h1>No internet connection</h1>
  <p>Check your Wi-Fi or mobile data and try again.</p>
</main>
<div class="act"><button class="btn" type="button" onclick="location.reload()">Try again</button></div>
<script>window.addEventListener('online',function(){location.reload()})</script>
</body>
</html>
